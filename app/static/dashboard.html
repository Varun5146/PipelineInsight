<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipelineInsight Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .repo-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 PipelineInsight</h1>
            <p class="subtitle">CI/CD Pipeline Analytics Dashboard</p>
        </header>
        
        <div class="controls">
            <div class="repo-input">
                <input 
                    type="text" 
                    id="repoName" 
                    placeholder="Enter repository name (e.g., PipelineInsight)"
                    value="PipelineInsight"
                >
                <button onclick="collectData()">Collect Data</button>
                <button onclick="loadStats()">Refresh Stats</button>
            </div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading" style="display: none;">Loading...</div>
        
        <div id="stats" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Runs</div>
                    <div class="stat-value" id="totalRuns">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Success Rate</div>
                    <div class="stat-value" id="successRate">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Avg Duration</div>
                    <div class="stat-value" id="avgDuration">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Failed Builds</div>
                    <div class="stat-value" id="failedBuilds">-</div>
                </div>
            </div>
            
            <div class="charts">
                <div class="chart-container">
                    <h3>Success vs Failed</h3>
                    <canvas id="pieChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Build Performance</h3>
                    <canvas id="barChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pieChart = null;
        let barChart = null;
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        async function collectData() {
            const repoName = document.getElementById('repoName').value.trim();
            if (!repoName) {
                showError('Please enter a repository name');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(`/collect/${repoName}`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (response.ok) {
                    alert(`Collected ${data.new_runs_collected} new workflow runs!`);
                    loadStats();
                } else {
                    showError(data.detail || 'Failed to collect data');
                }
            } catch (error) {
                showError('Error collecting data: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        async function loadStats() {
            const repoName = document.getElementById('repoName').value.trim();
            if (!repoName) {
                showError('Please enter a repository name');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(`/stats/${repoName}`);
                const data = await response.json();
                
                if (response.ok && data.total_runs > 0) {
                    displayStats(data);
                    document.getElementById('stats').style.display = 'block';
                } else {
                    showError(data.message || 'No data available. Collect data first!');
                    document.getElementById('stats').style.display = 'none';
                }
            } catch (error) {
                showError('Error loading stats: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        function displayStats(data) {
            document.getElementById('totalRuns').textContent = data.total_runs;
            document.getElementById('successRate').textContent = data.success_rate;
            document.getElementById('avgDuration').textContent = data.average_duration_minutes.toFixed(1) + 'm';
            document.getElementById('failedBuilds').textContent = data.failed;
            
            // Pie Chart
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            if (pieChart) pieChart.destroy();
            
            pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: ['Successful', 'Failed'],
                    datasets: [{
                        data: [data.successful, data.failed],
                        backgroundColor: ['#10b981', '#ef4444']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
            
            // Bar Chart
            const barCtx = document.getElementById('barChart').getContext('2d');
            if (barChart) barChart.destroy();
            
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['Successful', 'Failed', 'Total'],
                    datasets: [{
                        label: 'Build Count',
                        data: [data.successful, data.failed, data.total_runs],
                        backgroundColor: ['#10b981', '#ef4444', '#667eea']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }
        
        // Auto-load stats on page load
        window.onload = () => {
            loadStats();
        };
    </script>
</body>
</html>
